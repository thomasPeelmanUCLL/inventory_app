name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend: Type-check · Lint · Build ──────────────────
  frontend:
    name: Frontend · Type-check · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end

    env:
      # Public URL for better-auth (browser-side auth flows)
      NEXT_PUBLIC_API_URL: http://localhost:3000
      # Internal URL for pod-to-pod API proxying (Next.js rewrites)
      INTERNAL_API_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Backend: Type-check · Lint · Build ───────────────────
  backend:
    name: Backend · Type-check · Lint · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  # ── Backend: Migration check ──────────────────────────────
  migrate:
    name: Backend · Migration check
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: back-end

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_USER: inventory
          MYSQL_PASSWORD: inventory
          MYSQL_DATABASE: inventory_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot || exit 1"
          --health-start-period 30s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: mysql://inventory:inventory@localhost:3306/inventory_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Prisma schema for MariaDB
        run: npx prisma db push --accept-data-loss --skip-generate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test
