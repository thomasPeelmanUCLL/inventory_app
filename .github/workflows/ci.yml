name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend: Type-check · Lint · Build ──────────────────
  frontend:
    name: Frontend · Type-check · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end

    env:
      # Public URL for better-auth (browser-side auth flows)
      NEXT_PUBLIC_API_URL: http://localhost:3000
      # Internal URL for pod-to-pod API proxying (Next.js rewrites)
      INTERNAL_API_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Backend: Type-check · Lint · Build ───────────────────
  backend:
    name: Backend · Type-check · Lint · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  # ── Backend: Migration check ──────────────────────────────
  migrate:
    name: Backend · Migration check
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: back-end

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://inventory:inventory@localhost:5432/inventory_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test
