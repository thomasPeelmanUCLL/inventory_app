name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-inventory-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ── 1. CI gate ────────────────────────────────────────────
  ci-frontend:
    name: Frontend · Type-check · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  ci-backend:
    name: Backend · Type-check · Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint

  # ── 2. Build & push Docker images to GHCR ────────────────
  docker-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    needs: ci-frontend
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/thomaspeelmanucll/inventory-frontend
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: front-end
          file: front-end/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    needs: ci-backend
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      sha_tag: ${{ env.REGISTRY }}/thomaspeelmanucll/inventory-backend:sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/thomaspeelmanucll/inventory-backend
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: back-end
          file: back-end/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to Kubernetes ───────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-frontend, docker-backend]
    if: github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          sed -i "s|server:.*|server: ${{ secrets.K8S_API_SERVER }}|g" ~/.kube/config
          echo "--- Effective server after patch ---"
          grep "server:" ~/.kube/config

      - name: Verify cluster connectivity
        run: |
          SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          echo "Connecting to: $SERVER"
          if echo "$SERVER" | grep -qE '127\.0\.0\.1|localhost|\[::1\]'; then
            echo "::error::KUBECONFIG points to localhost. Set REAL cluster kubeconfig in secrets."
            exit 1
          fi
          kubectl cluster-info

      - name: Create / update backend secret
        run: |
          kubectl create secret generic inventory-backend-secret \
            --namespace inventory \
            --from-literal=DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --from-literal=BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifest changes
        run: kubectl apply -f k8s/

      - name: Run Prisma migrations
        run: |
          kubectl delete pod prisma-migrate -n inventory --ignore-not-found=true

          kubectl run prisma-migrate \
            --image=${{ needs.docker-backend.outputs.sha_tag }} \
            --restart=Never \
            --namespace=inventory \
            --env="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --command -- npx prisma migrate deploy

          kubectl wait pod/prisma-migrate \
            --for=jsonpath='{.status.phase}'=Succeeded \
            -n inventory \
            --timeout=120s

          kubectl logs prisma-migrate -n inventory
          kubectl delete pod prisma-migrate -n inventory --ignore-not-found=true

      - name: Run Prisma migrations — cleanup on failure
        if: failure()
        run: kubectl delete pod prisma-migrate -n inventory --ignore-not-found=true

      - name: Update backend image
        run: |
          kubectl set image deployment/inventory-backend \
            backend=${{ needs.docker-backend.outputs.sha_tag }} \
            -n inventory

      - name: Update frontend image
        run: |
          kubectl set image deployment/inventory-frontend \
            frontend=${{ env.REGISTRY }}/thomaspeelmanucll/inventory-frontend:sha-${{ github.sha }} \
            -n inventory

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/inventory-backend -n inventory --timeout=300s

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/inventory-frontend -n inventory --timeout=120s

      - name: Verify pods are healthy
        run: kubectl get pods -n inventory

      - name: Debug — show pod details on failure
        if: failure()
        run: |
          echo "==== Pods ===="
          kubectl get pods -n inventory -o wide
          echo ""
          echo "==== Backend events ===="
          kubectl describe deployment inventory-backend -n inventory | tail -30
          echo ""
          echo "==== Pod logs ===="
          for pod in $(kubectl get pods -n inventory -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n inventory --tail=50 2>/dev/null || true
          done
