apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-food-api-to-inventory-backend
  namespace: inventory
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: iswleuven
      ports:
        - protocol: TCP
          port: 3000
