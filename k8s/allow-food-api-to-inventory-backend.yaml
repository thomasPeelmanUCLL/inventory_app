# Once any NetworkPolicy selects a pod, every source it doesn't list is blocked,
# so this has to name all three callers of the backend, not just food-api.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-food-api-to-inventory-backend
  namespace: inventory
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Inventory frontend: Next.js proxies /api/backend/* pod-to-pod
        - podSelector:
            matchLabels:
              app: frontend
        # Ingress controller: serves /api/auth straight to the backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        # ISWLeuven food-api: reads the website catalogue
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: iswleuven
          podSelector:
            matchLabels:
              app: food-api
      ports:
        - protocol: TCP
          port: 3000
