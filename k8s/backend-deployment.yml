apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-backend
  namespace: inventory
  labels:
    app: backend
  annotations:
    argocd-image-updater.argoproj.io/image-list: backend=ghcr.io/thomaspeelmanucll/inventory-backend
    argocd-image-updater.argoproj.io/backend.update-strategy: digest
    argocd-image-updater.argoproj.io/backend.allow-tags: regexp:^sha-[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/backend.force-update: "false"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-db
          image: mariadb:11
          command:
            - sh
            - -c
            - |
              until mariadb -h postgres.inventory.svc.cluster.local \
                -P 3306 -uinventory -p"$MARIADB_PASSWORD" -e 'SELECT 1'; do
                echo "Waiting for inventory database..."
                sleep 2
              done
          env:
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
      containers:
        - name: backend
          image: ghcr.io/thomaspeelmanucll/inventory-backend:sha-2176e6758351e8b224c7ab5d24210c757bbabf43
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-backend-secret
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: inventory-backend-secret
                  key: BETTER_AUTH_SECRET
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-backend-secret
                  key: FRONTEND_URL
            - name: BACKEND_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-backend-secret
                  key: BACKEND_URL
            - name: INTEGRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inventory-integration-token
                  key: token
            - name: WEBSITE_INVENTORY_ID
              value: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
