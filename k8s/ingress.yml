# ── Backend IngressRoute ───────────────────────────────────────
# Domain must match the BACKEND_URL GitHub Actions secret (without https://).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-ingress
  namespace: inventory
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.thomaspeelman.be`)   # ← update to match your BACKEND_URL domain
      kind: Rule
      services:
        - name: inventory-backend
          port: 80
  tls:
    certResolver: cloudflare

---
# ── Frontend IngressRoute ──────────────────────────────────────
# Domain must match the FRONTEND_URL GitHub Actions secret (without https://).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-ingress
  namespace: inventory
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`inventory.thomaspeelman.be`)   # ← update to match your FRONTEND_URL domain
      kind: Rule
      services:
        - name: inventory-frontend
          port: 80
  tls:
    certResolver: cloudflare
