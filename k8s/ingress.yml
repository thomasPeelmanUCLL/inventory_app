apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-ingress
  namespace: inventory
spec:
  ingressClassName: nginx
  rules:
    - host: inventory.euroclasstravel.com
      http:
        paths:
          - path: /api/backend
            pathType: Prefix
            backend:
              service:
                name: inventory-frontend
                port:
                  number: 80
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: inventory-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inventory-frontend
                port:
                  number: 80
